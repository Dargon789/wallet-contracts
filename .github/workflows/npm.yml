name: npm

permissions: {}

on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: false
        description: The run id of the release to publish
  workflow_run:
    types: [completed]
    workflows: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NPM_CONFIG_PROVENANCE: true
  NPM_REGISTRY_URL: "https://registry.npmjs.org"

jobs:
  publish-arch:
    permissions:
      contents: read
      actions: read
      id-token: write
    name: ${{ matrix.tool }}-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          - tool: forge
            os: linux
            arch: amd64
          - tool: forge
            os: linux
            arch: arm64
          - tool: forge
            os: darwin
            arch: amd64
          - tool: forge
            os: darwin
            arch: arm64
          - tool: forge
            os: win32
            arch: amd64
          - tool: cast
            os: linux
            arch: amd64
          - tool: cast
            os: linux
            arch: arm64
          - tool: cast
            os: darwin
            arch: amd64
          - tool: cast
            os: darwin
            arch: arm64
          - tool: cast
            os: win32
            arch: amd64
          - tool: anvil
            os: linux
            arch: amd64
          - tool: anvil
            os: linux
            arch: arm64
          - tool: anvil
            os: darwin
            arch: amd64
          - tool: anvil
            os: darwin
            arch: arm64
          - tool: anvil
            os: win32
            arch: amd64
          - tool: chisel
            os: linux
            arch: amd64
          - tool: chisel
            os: linux
            arch: arm64
          - tool: chisel
            os: darwin
            arch: amd64
          - tool: chisel
            os: darwin
            arch: arm64
          - tool: chisel
            os: win32
            arch: amd64
    # Run automatically after a successful 'release' workflow, or manually if a run_id is provided
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_id != '')
      }}
    outputs:
      RELEASE_VERSION: ${{ steps.release-version.outputs.RELEASE_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set Isolated Artifact Directory
        id: paths
        run: |
          set -euo pipefail
          printf 'artifact_dir=%s\n' "$RUNNER_TEMP/foundry_artifacts" >> "$GITHUB_OUTPUT"

      - name: Prepare Isolated Artifact Directory
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.artifact_dir }}
        run: |
          mkdir -p "$ARTIFACT_DIR"
          ls -la "$ARTIFACT_DIR" || true

      - name: Download Release Assets
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          # Download all foundry artifacts from the triggering release run
          pattern: "foundry_*"
          # Extract artifacts into an isolated temp directory, not the workspace
          path: ${{ steps.paths.outputs.artifact_dir }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}

      - name: Validate Downloaded Artifacts
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.artifact_dir }}
        run: |
          set -euo pipefail

          echo "Validating artifacts in: $ARTIFACT_DIR"

          if [[ -z "${ARTIFACT_DIR:-}" ]]; then
            echo "ERROR: ARTIFACT_DIR is not set" >&2
            exit 1
          fi

          if [[ ! -d "$ARTIFACT_DIR" ]]; then
            echo "ERROR: ARTIFACT_DIR does not exist or is not a directory: $ARTIFACT_DIR" >&2
            exit 1
          fi

          # Require at least one file to have been downloaded
          if ! find "$ARTIFACT_DIR" -type f -mindepth 1 -print -quit | grep -q .; then
            echo "ERROR: No files found in ARTIFACT_DIR ($ARTIFACT_DIR)" >&2
            exit 1
          fi

          echo "Artifact file manifest:"
          find "$ARTIFACT_DIR" -type f -printf '%P\n' | sort

          # Disallow world- or group-writable files inside the artifact directory
          if find "$ARTIFACT_DIR" -type f -perm -002 -print -quit | grep -q .; then
            echo "ERROR: Found world-writable files in ARTIFACT_DIR" >&2
            find "$ARTIFACT_DIR" -type f -perm -002 -printf '%p %m\n' >&2
            exit 1
          fi
          if find "$ARTIFACT_DIR" -type f -perm -020 -print -quit | grep -q .; then
            echo "ERROR: Found group-writable files in ARTIFACT_DIR" >&2
            find "$ARTIFACT_DIR" -type f -perm -020 -printf '%p %m\n' >&2
            exit 1
          fi

          # For defense in depth, reject unexpected script or executable types.
          # Only compressed archives (e.g., .tar, .tar.gz, .tgz, .zip) and text/metadata files are allowed.
          if find "$ARTIFACT_DIR" -type f \( \
                -name '*.sh' -o -name '*.bash' -o -name '*.zsh' -o -name '*.ps1' -o -name '*.cmd' -o -name '*.bat' \
              \) -print -quit | grep -q .; then
            echo "ERROR: Found disallowed script files in ARTIFACT_DIR" >&2
            find "$ARTIFACT_DIR" -type f \( \
                -name '*.sh' -o -name '*.bash' -o -name '*.zsh' -o -name '*.ps1' -o -name '*.cmd' -o -name '*.bat' \
              \) -printf '%p\n' >&2
            exit 1
          fi

          # Reject nested VCS/CI metadata which should not be present in release artifacts.
          if find "$ARTIFACT_DIR" -type d \( -name '.git' -o -name '.github' -o -name '.gitlab' \) -print -quit | grep -q .; then
            echo "ERROR: Found unexpected VCS/CI metadata directories in ARTIFACT_DIR" >&2
            find "$ARTIFACT_DIR" -type d \( -name '.git' -o -name '.github' -o -name '.gitlab' \) -printf '%p\n' >&2
            exit 1
          fi

          if [[ ! -d "$ARTIFACT_DIR" ]]; then
            echo "ERROR: ARTIFACT_DIR does not exist or is not a directory: $ARTIFACT_DIR" >&2
            exit 1
          fi

          # Ensure the directory is not world-writable.
          perms="$(stat -c '%a' "$ARTIFACT_DIR" || echo '')"
          if [[ -n "$perms" && "${perms: -1}" -ge 6 ]]; then
            echo "ERROR: ARTIFACT_DIR is world-writable (perms=$perms)" >&2
            exit 1
          fi

          echo "Listing contents of ARTIFACT_DIR:"
          find "$ARTIFACT_DIR" -maxdepth 3 -mindepth 1 -print || true

          # Fail if directory is empty.
          if ! find "$ARTIFACT_DIR" -mindepth 1 -print -quit | grep -q .; then
            echo "ERROR: ARTIFACT_DIR is empty; no artifacts downloaded" >&2
            exit 1
          fi

          # Disallow symlinks to avoid artifact-based path escapes.
          if find "$ARTIFACT_DIR" -type l -print -quit | grep -q .; then
            echo "ERROR: Symlinks detected in ARTIFACT_DIR; refusing to continue" >&2
            find "$ARTIFACT_DIR" -type l -ls >&2 || true
            exit 1
          fi

          # Basic sanity check on file paths to prevent obvious traversal attempts.
          if find "$ARTIFACT_DIR" -mindepth 1 -print | grep -E '/\.\./|^\.\./|\.\.$' | grep -q .; then
            echo "ERROR: Suspicious '..' components detected in artifact paths" >&2
            find "$ARTIFACT_DIR" -mindepth 1 -print >&2 || true
            exit 1
          fi

          echo "Artifact directory validation completed successfully."

          if [[ ! -d "$ARTIFACT_DIR" ]]; then
            echo "ERROR: Artifact directory does not exist: $ARTIFACT_DIR" >&2
            exit 1
          fi

          ARTIFACT_ROOT="$(realpath "$ARTIFACT_DIR")"
          echo "Resolved artifact root: $ARTIFACT_ROOT"

          # Ensure there are no symlinks anywhere under the artifact root
          if find "$ARTIFACT_ROOT" -type l | grep -q .; then
            echo "ERROR: Symlinks detected inside artifact directory; refusing to continue." >&2
            find "$ARTIFACT_ROOT" -type l -print >&2 || true
            exit 1
          fi

          # Validate top-level entries: must be directories with safe names matching TOOL-PLATFORM-ARCH pattern
          shopt -s nullglob
          entries=("$ARTIFACT_ROOT"/*)
          shopt -u nullglob

          if [[ ${#entries[@]} -eq 0 ]]; then
            echo "ERROR: No artifacts found under $ARTIFACT_ROOT" >&2
            exit 1
          fi

          for entry in "${entries[@]}"; do
            name="$(basename "$entry")"

            # Only allow alphanumerics, dashes, and underscores in directory names
            if [[ "$name" =~ [^A-Za-z0-9_-] ]]; then
              echo "ERROR: Artifact entry has invalid characters in name: $name" >&2
              exit 1
            fi

            # Expect names of the form TOOL-PLATFORM-ARCH
            if [[ ! "$name" =~ ^[A-Za-z0-9_-]+-[A-Za-z0-9_-]+-[A-Za-z0-9_-]+$ ]]; then
              echo "ERROR: Unexpected artifact entry name (expected TOOL-PLATFORM-ARCH): $name" >&2
              exit 1
            fi

            if [[ ! -d "$entry" ]]; then
              echo "ERROR: Top-level artifact entry is not a directory: $entry" >&2
              exit 1
            fi

            # Ensure each entry resolves inside the artifact root
            resolved="$(realpath "$entry")"
            case "$resolved" in
              "$ARTIFACT_ROOT"/*) ;;
              *)
                echo "ERROR: Artifact entry resolves outside artifact root:" >&2
                echo "  entry=$entry" >&2
                echo "  resolved=$resolved" >&2
                exit 1
                ;;
            esac
          done

          echo "Artifact validation completed successfully."

          if ! find "$ARTIFACT_DIR" -mindepth 1 -print -quit | grep -q .; then
            echo "ERROR: Artifact directory is empty: $ARTIFACT_DIR" >&2
            exit 1
          fi

          # Reject files with suspicious paths (absolute paths or parent directory traversals)
          # Use null-delimited paths to safely handle filenames with newlines or whitespace
          while IFS= read -r -d '' path; do
            rel="${path#"$ARTIFACT_DIR"/}"
            if [[ "$rel" == /* ]] || [[ "$rel" == *".."* ]]; then
              echo "ERROR: Suspicious artifact path detected: $rel" >&2
              exit 1
            fi
          done < <(find "$ARTIFACT_DIR" -type f -print0)

          echo "Artifact validation completed successfully."

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish auth)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Derive RELEASE_VERSION
        id: release-version
        working-directory: ./npm
        env:
          PROVENANCE: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY_URL: ${{ env.NPM_REGISTRY_URL }}
          ARTIFACT_DIR: ${{ steps.paths.outputs.artifact_dir }}
        run: |
          set -euo pipefail

          echo "Artifacts in $ARTIFACT_DIR:"
          ls -la "$ARTIFACT_DIR" || true

          # Derive RELEASE_VERSION from any foundry artifact we downloaded
          # Expected names: foundry_<VERSION>_<platform>_<arch>.{tar.gz,zip}
          shopt -s nullglob
          foundry_files=("$ARTIFACT_DIR"/foundry_*)
          shopt -u nullglob

          if [[ ${#foundry_files[@]} -eq 0 ]]; then
            echo "No foundry artifacts found to publish in $ARTIFACT_DIR" >&2
            exit 1
          fi

          first_file="${foundry_files[0]}"
          version_part=$(basename "$first_file")
          version_part=${version_part#foundry_}
          RELEASE_VERSION=${version_part%%_*}

          # Validate derived RELEASE_VERSION to mitigate artifact poisoning
          # Require a sane version format, e.g. 1.2.3 or 1.2.3-beta.1
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Derived RELEASE_VERSION '$RELEASE_VERSION' from artifact '$first_file' is not a valid version" >&2
            exit 1
          fi

          export RELEASE_VERSION
          echo "Detected RELEASE_VERSION=$RELEASE_VERSION from artifact $first_file"

          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >>"$GITHUB_OUTPUT"

      - name: Stage Binary Into Package
        working-directory: ./npm
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.RELEASE_VERSION }}
          ARTIFACT_DIR: ${{ steps.paths.outputs.artifact_dir }}
        run: |
          set -euo pipefail

          echo "Staging binary from validated artifacts in: $ARTIFACT_DIR"

          bun ./scripts/stage-from-artifact.mjs \
            --tool '${{ matrix.tool }}' \
            --platform '${{ matrix.os }}' \
            --arch '${{ matrix.arch }}' \
            --release-version "$RELEASE_VERSION" \
            --artifact-dir "$ARTIFACT_DIR"

      - name: Sanity Check Binary
        working-directory: ./npm
        run: |
          set -euo pipefail
          TOOL='${{ matrix.tool }}'
          PLATFORM='${{ matrix.os }}'
          ARCH='${{ matrix.arch }}'

          PKG_DIR="./@foundry-rs/${TOOL}-${PLATFORM}-${ARCH}"
          BIN="$PKG_DIR/bin/${TOOL}"
          if [[ "$PLATFORM" == "win32" ]]; then
            BIN="$PKG_DIR/bin/${TOOL}.exe"
          fi
          echo "Verifying binary at: $BIN"
          ls -la "$BIN"
          if [[ ! -f "$BIN" ]]; then
            echo "ERROR: Binary not found at $BIN" >&2
            exit 1
          fi

          if [[ "${{ matrix.os }}" != "win32" ]]; then
            if [[ ! -x "$BIN" ]]; then
              echo "ERROR: Binary not marked executable" >&2
              exit 1
            fi
          fi

      - name: Publish ${{ matrix.os }}-${{ matrix.arch }} Binary
        working-directory: ./npm
        env:
          PROVENANCE: true
          VERSION_NAME: ${{ steps.release-version.outputs.RELEASE_VERSION }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.RELEASE_VERSION }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ARTIFACT_DIR: ${{ steps.paths.outputs.artifact_dir }}
        run: |
          set -euo pipefail

          TOOL='${{ matrix.tool }}'
          PLATFORM='${{ matrix.os }}'
          ARCH='${{ matrix.arch }}'

          # Basic validation of matrix-derived values to avoid path manipulation
          case "$TOOL" in
            (*[!a-zA-Z0-9_-]*|'') echo "ERROR: Invalid TOOL value: $TOOL" >&2; exit 1 ;;
          esac
          case "$PLATFORM" in
            (*[!a-zA-Z0-9_-]*|'') echo "ERROR: Invalid PLATFORM value: $PLATFORM" >&2; exit 1 ;;
          esac
          case "$ARCH" in
            (*[!a-zA-Z0-9_-]*|'') echo "ERROR: Invalid ARCH value: $ARCH" >&2; exit 1 ;;
          esac

          PACKAGE_DIR="./@foundry-rs/${TOOL}-${PLATFORM}-${ARCH}"
          EXPECTED_PKG_NAME="${TOOL}-${PLATFORM}-${ARCH}"

          # Ensure corresponding artifact directory exists in the isolated artifact dir
          if [[ -z "${ARTIFACT_DIR:-}" ]]; then
            echo "ERROR: ARTIFACT_DIR is not set; refusing to publish." >&2
            exit 1
          fi

          # Ensure ARTIFACT_DIR is exactly the isolated directory we created earlier
          EXPECTED_ARTIFACT_ROOT="${RUNNER_TEMP%/}/foundry_artifacts"
          ABS_ARTIFACT_DIR="$(realpath "$ARTIFACT_DIR")"
          ABS_EXPECTED_ARTIFACT_ROOT="$(realpath "$EXPECTED_ARTIFACT_ROOT")"
          if [[ "$ABS_ARTIFACT_DIR" != "$ABS_EXPECTED_ARTIFACT_ROOT" ]]; then
            echo "ERROR: ARTIFACT_DIR ($ABS_ARTIFACT_DIR) does not match expected isolated artifact root ($ABS_EXPECTED_ARTIFACT_ROOT); refusing to publish." >&2
            exit 1
          fi

          EXPECTED_ARTIFACT_PATH="${ARTIFACT_DIR}/${EXPECTED_PKG_NAME}"
          if [[ ! -d "$EXPECTED_ARTIFACT_PATH" ]]; then
            echo "ERROR: Expected artifact directory not found at: $EXPECTED_ARTIFACT_PATH" >&2
            exit 1
          fi

          # Resolve artifact path to an absolute path and ensure it stays within ARTIFACT_DIR
          ABS_ARTIFACT_PATH="$(realpath "$EXPECTED_ARTIFACT_PATH")"
          ABS_ARTIFACT_ROOT="$(realpath "$ARTIFACT_DIR")"
          case "$ABS_ARTIFACT_PATH" in
            "$ABS_ARTIFACT_ROOT"/*) ;;
            *)
              echo "ERROR: Resolved artifact path is outside isolated artifact root:" >&2
              echo "  ABS_ARTIFACT_PATH=$ABS_ARTIFACT_PATH" >&2
              echo "  ABS_ARTIFACT_ROOT=$ABS_ARTIFACT_ROOT" >&2
              exit 1
              ;;
          esac

          echo "Preparing to publish package from: $PACKAGE_DIR (artifact: $EXPECTED_ARTIFACT_PATH)"

          if [[ ! -d "$PACKAGE_DIR" ]]; then
            echo "ERROR: Package directory does not exist: $PACKAGE_DIR" >&2
            exit 1
          fi

          # Resolve to an absolute path and ensure it stays within ./@foundry-rs
          ABS_PACKAGE_DIR="$(realpath "$PACKAGE_DIR")"
          ABS_EXPECTED_ROOT="$(realpath "./@foundry-rs")"
          case "$ABS_PACKAGE_DIR" in
            "$ABS_EXPECTED_ROOT"/*) ;;
            *)
              echo "ERROR: Resolved package directory is outside expected root:" >&2
              echo "  ABS_PACKAGE_DIR=$ABS_PACKAGE_DIR" >&2
              echo "  ABS_EXPECTED_ROOT=$ABS_EXPECTED_ROOT" >&2
              exit 1
              ;;
          esac

          ls -la "$PACKAGE_DIR"

          # Minimal sanity check: require a package.json in the source package before publishing
          if [[ ! -f "$PACKAGE_DIR/package.json" ]]; then
            echo "ERROR: package.json not found in $PACKAGE_DIR; refusing to publish." >&2
            exit 1
          fi

          # Require that the artifact also contains a package.json and ensure it matches the source package
          if [[ ! -f "$EXPECTED_ARTIFACT_PATH/package.json" ]]; then
            echo "ERROR: package.json not found in artifact at $EXPECTED_ARTIFACT_PATH; refusing to publish from potentially poisoned artifact." >&2
            exit 1
          fi

          # Extract name and version from both package.json files using jq if available; fall back to grep/sed
          if command -v jq >/dev/null 2>&1; then
            SRC_NAME="$(jq -r '.name // empty' < "$PACKAGE_DIR/package.json")"
            SRC_VERSION="$(jq -r '.version // empty' < "$PACKAGE_DIR/package.json")"
            ART_NAME="$(jq -r '.name // empty' < "$EXPECTED_ARTIFACT_PATH/package.json")"
            ART_VERSION="$(jq -r '.version // empty' < "$EXPECTED_ARTIFACT_PATH/package.json")"
          else
            SRC_NAME="$(grep -m1 '"name"' "$PACKAGE_DIR/package.json" | sed -E 's/.*"name"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/')"
            SRC_VERSION="$(grep -m1 '"version"' "$PACKAGE_DIR/package.json" | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/')"
            ART_NAME="$(grep -m1 '"name"' "$EXPECTED_ARTIFACT_PATH/package.json" | sed -E 's/.*"name"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/')"
            ART_VERSION="$(grep -m1 '"version"' "$EXPECTED_ARTIFACT_PATH/package.json" | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/')"
          fi

          if [[ -n "$SRC_NAME" && -n "$ART_NAME" && "$SRC_NAME" != "$ART_NAME" ]]; then
            echo "ERROR: Artifact package name ($ART_NAME) does not match source package name ($SRC_NAME); refusing to publish." >&2
            exit 1
          fi

          if [[ -n "$SRC_VERSION" && -n "$ART_VERSION" && "$SRC_VERSION" != "$ART_VERSION" ]]; then
            echo "ERROR: Artifact package version ($ART_VERSION) does not match source package version ($SRC_VERSION); refusing to publish." >&2
            exit 1
          fi

          # Perform a strict content integrity check between the artifact and the package directory.
          # This ensures we only publish content that exactly matches the validated artifact,
          # preventing poisoned artifacts from influencing what is published.
          echo "Computing integrity hashes for artifact and package directory..."
          TMP_DIR="$(mktemp -d "${RUNNER_TEMP%/}/artifact_cmp.XXXXXXXX")"
          ART_TAR="${TMP_DIR}/artifact.tar"
          PKG_TAR="${TMP_DIR}/package.tar"

          # Create deterministic tarballs (no absolute paths) of both directories
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$EXPECTED_ARTIFACT_PATH" -cf "$ART_TAR" .
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$PACKAGE_DIR" -cf "$PKG_TAR" .

          ART_HASH="$(sha256sum "$ART_TAR" | cut -d' ' -f1)"
          PKG_HASH="$(sha256sum "$PKG_TAR" | cut -d' ' -f1)"

          echo "Artifact hash: $ART_HASH"
          echo "Package  hash: $PKG_HASH"

          if [[ "$ART_HASH" != "$PKG_HASH" ]]; then
            echo "ERROR: Artifact contents do not match package directory contents; refusing to publish from potentially poisoned artifact." >&2
            exit 1
          fi

          rm -rf "$TMP_DIR"

          bun ./scripts/publish.mjs "$PACKAGE_DIR"

          echo "Published @foundry-rs/${TOOL}-${PLATFORM}-${ARCH}"

  publish-meta:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs: publish-arch
    name: Publish Meta Package
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_VERSION: ${{ needs.publish-arch.outputs.RELEASE_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish auth)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        working-directory: ./npm
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ./npm
        run: bun tsc --project tsconfig.json --noEmit

      - name: Publish Meta Packages
        working-directory: ./npm
        run: |
          set -euo pipefail
          bun ./scripts/publish-meta.mjs --release-version "$RELEASE_VERSION"
        env:
          PROVENANCE: true
          VERSION_NAME: ${{ env.RELEASE_VERSION }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
          NPM_REGISTRY_URL: ${{ env.NPM_REGISTRY_URL }}
